<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Visual Analytics</title>
  
  <!-- Embedded Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js for Visual Graphs -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">
    
    <!-- Header & Input Area -->
    <header class="text-center space-y-4">
      <h1 class="text-3xl font-bold text-indigo-400">GitHub Profile & Repo Analytics</h1>
      <p class="text-gray-400 text-sm">Enter any GitHub username to generate instant visual insights</p>
      
      <div class="flex justify-center gap-2 pt-2">
        <input id="username" type="text" placeholder="Enter GitHub Username..." 
               class="px-4 py-2 rounded bg-gray-800 border border-gray-700 focus:outline-none focus:border-indigo-500 w-72 text-white">
        <button onclick="fetchProfile()" 
                class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 font-semibold rounded transition">
          Analyze
        </button>
      </div>
    </header>

    <!-- Profile Overview Card -->
    <div id="profile-card" class="hidden bg-gray-800 p-6 rounded-xl border border-gray-700 flex flex-col md:flex-row items-center gap-6">
      <img id="avatar" class="w-24 h-24 rounded-full border-2 border-indigo-400 shadow-lg" src="" alt="Avatar">
      <div class="space-y-2 text-center md:text-left flex-1">
        <h2 id="name" class="text-2xl font-bold"></h2>
        <p id="bio" class="text-gray-400 text-sm"></p>
        <div class="flex gap-4 justify-center md:justify-start text-sm pt-2 flex-wrap">
          <span class="bg-gray-700 px-3 py-1 rounded">Public Repos: <b id="repos-count" class="text-indigo-300">0</b></span>
          <span class="bg-gray-700 px-3 py-1 rounded">Followers: <b id="followers-count" class="text-indigo-300">0</b></span>
          <span class="bg-indigo-900 text-indigo-200 px-3 py-1 rounded font-bold border border-indigo-500">
            Dev Score: <span id="dev-score">0</span>/100
          </span>
        </div>
      </div>
    </div>

    <!-- Analytics Charts Section -->
    <div id="charts-section" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Languages Chart Card -->
      <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 flex flex-col items-center">
        <h3 class="text-lg font-semibold mb-4 text-indigo-300">Language Distribution</h3>
        <div class="w-64 h-64">
          <canvas id="langChart"></canvas>
        </div>
      </div>

      <!-- Top Repositories Card -->
      <div class="bg-gray-800 p-6 rounded-xl border border-gray-700">
        <h3 class="text-lg font-semibold mb-4 text-indigo-300">Top Repositories (by Stars)</h3>
        <ul id="repo-list" class="space-y-3 text-sm"></ul>
      </div>

    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
